<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">☀️ Claro</button>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div class="hs-section">
          <span class="label">TOP 5 RÉCORDS</span>
          <ol id="gameover-highscore-list" class="hs-list"></ol>
        </div>
        <div class="hs-stats">
          <div class="hs-stat">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="gameover-best-combo">0</span>
          </div>
          <div class="hs-stat">
            <span class="label">MÁS LÍNEAS</span>
            <span class="value" id="gameover-best-lines">0</span>
          </div>
        </div>

        <div id="save-score-form" class="save-score-form hidden">
          <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" />
          <button id="save-score-btn" type="button">Guardar</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="start-overlay" class="overlay start-overlay">
    <div class="overlay-box">
      <h2 class="start-title">TETRIS</h2>

      <div class="hs-section">
        <span class="label">TOP 5 RÉCORDS</span>
        <ol id="start-highscore-list" class="hs-list"></ol>
      </div>
      <div class="hs-stats">
        <div class="hs-stat">
          <span class="label">MEJOR COMBO</span>
          <span class="value" id="start-best-combo">0</span>
        </div>
        <div class="hs-stat">
          <span class="label">MÁS LÍNEAS</span>
          <span class="value" id="start-best-lines">0</span>
        </div>
      </div>

      <button id="start-play-btn" type="button">Jugar</button>
      <button id="reset-scores-btn" type="button" class="secondary-btn">Resetear récords</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
